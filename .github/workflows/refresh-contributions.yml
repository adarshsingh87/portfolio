# Refreshes the contribution snapshot behind the homepage facade, redeploys
# the site, then commits the new data back to master.
#
# Repository secrets this needs (Settings > Secrets and variables > Actions):
#   CLOUDFLARE_API_TOKEN   a token from the "Edit Cloudflare Workers" template
#   CLOUDFLARE_ACCOUNT_ID  from the Workers & Pages overview in the dashboard
#
# The GitHub data uses the built-in GITHUB_TOKEN. Private contributions are
# public on the profile calendar, so no personal token is needed.
#
# This deploys master as it is on GitHub. Push your local changes before it
# runs, or it will deploy an older version of the site.

name: Refresh contributions

on:
  schedule:
    # Mondays, 06:00 IST
    - cron: '30 0 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Fetch contribution calendar
        run: pnpm generate:contributions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and deploy
        run: pnpm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Only after a successful deploy, so master never claims data that is
      # not live. The build also regenerates the share images from the data.
      - name: Commit refreshed data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/data/contributions.json public
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'chore: refresh contribution snapshot'
            git push
          fi
